name: Persistent foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  stack:
    name: Native ${{ matrix.arch }} tests, startup and migrations
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      FOCUSPOCUS_IMAGE: localhost/focuspocus:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native engine
        run: bash ops/assert-native.sh
      - name: Validate Mac Compose model
        run: docker compose -f compose.dev.yaml --profile testing config --quiet
      - name: Build application image
        run: docker build --target application --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$FOCUSPOCUS_IMAGE" .
      - name: Verify the built image and persistent stack
        if: matrix.arch == 'arm64'
        env:
          FOCUSPOCUS_CI_JOB_ID: ${{ job.check_run_id }}
        run: bash ops/verify-stack.sh
      - name: Verify native AMD64 using disposable sibling bind storage
        if: matrix.arch == 'amd64'
        env:
          FOCUSPOCUS_CI_JOB_ID: ${{ job.check_run_id }}
        run: |
          mkdir -p build
          parent=$(mktemp -d "$PWD/build/host-layout.XXXXXXXX")
          mkdir "$parent/first" "$parent/second"
          touch "$parent/first/neighbor-canary"
          first=$(docker create --network none --mount "type=bind,src=$parent/first,dst=/data,readonly" "$FOCUSPOCUS_IMAGE")
          second=
          sibling_volume=
          cleanup() {
            if [[ -n "$second" ]]; then docker rm "$second" >/dev/null; fi
            if [[ -n "$sibling_volume" ]]; then docker volume rm "$sibling_volume" >/dev/null; fi
            docker rm "$first" >/dev/null
          }
          trap cleanup EXIT
          sibling_volume=$(docker volume create --driver local --opt type=none --opt o=bind --opt "device=$parent/second")
          second=$(docker create --network none --mount "type=volume,src=$sibling_volume,dst=/data,readonly" "$FOCUSPOCUS_IMAGE")
          FOCUSPOCUS_TEST_DATA_PARENT="$parent" python3 -B ops/host_test_data.py
          test -f "$parent/first/neighbor-canary"
          test -d "$parent/focuspocus"
          test -z "$(ls -A "$parent/focuspocus")"
      - name: Retain the encrypted-recovery verification summary
        if: ${{ !cancelled() && hashFiles('build/recovery/report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-${{ matrix.arch }}
          path: build/recovery/report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
