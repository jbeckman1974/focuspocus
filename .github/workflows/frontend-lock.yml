name: Refresh frontend dependency lock

on: workflow_dispatch

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and validate the lock in a native AMD64 container
        env:
          NODE_IMAGE: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
        run: |
          set -eu
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          case "$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/x86_64|linux/amd64) ;;
            *) exit 1 ;;
          esac
          docker run --rm -i --user node --workdir /tmp --env NPM_CONFIG_CACHE=/tmp/npm-cache "$NODE_IMAGE" sh -ec '
            test "$(node -p "process.platform + \"/\" + process.arch")" = linux/x64
            test "$(node -v)" = v24.22.3
            test "$(npm -v)" = 11.19.1
            cd "$(mktemp -d)"
            cat > package.json
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund >&2
            npm ci --ignore-scripts --no-audit --no-fund >&2
            ./node_modules/.bin/tsc --version >&2
            ./node_modules/.bin/vite --version >&2
            cat package-lock.json
          ' < frontend/package.json > frontend/package-lock.json
          sha256sum frontend/package-lock.json
      - name: Record the public dependency lock for source review
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          path = Path("frontend/package-lock.json")
          content = path.read_text()
          packages = json.loads(content)["packages"].values()
          for package in packages:
              if "resolved" in package:
                  url = urlsplit(package["resolved"])
                  assert (url.scheme, url.netloc) == ("https", "registry.npmjs.org")
                  assert not url.query and not url.fragment
          print("BEGIN REVIEWED NPM LOCK")
          print(content, end="")
          print("END REVIEWED NPM LOCK")
      - name: Return the source lockfile for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 2
