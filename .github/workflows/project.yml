name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify local-only artifact boundaries
        run: |
          test -z "$(git ls-files -- build/)"
          git check-ignore -q -- build/OmniFocus/index.html
          git check-ignore -q -- build/vm/lima/tw/diffdisk
      - name: Test reference archive
        run: python3 -B -m unittest discover -s tools/references -v
      - name: Test image promotion safeguards
        run: python3 -B -m unittest discover -s tools/release -v
      - name: Test disposable VM tooling
        run: |
          sh -n tools/vm/guest.sh
          python3 -B -m unittest discover -s tools/vm -v
