name: Outline application

on:
  pull_request:
    paths: ["frontend/**", "compose.dev.yaml", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "compose.dev.yaml", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  native:
    name: Native Linux ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            platform: amd64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            arch: ARM64
            platform: arm64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      EXPECTED_RUNNER: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      NODE_ARCH: ${{ matrix.node_arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the native runner and Docker daemon
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER"
          case "$PLATFORM:$(uname -m):$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            amd64:x86_64:linux/x86_64|amd64:x86_64:linux/amd64) ;;
            arm64:aarch64:linux/aarch64|arm64:aarch64:linux/arm64) ;;
            *) exit 1 ;;
          esac
      - name: Build the locked development image
        id: build
        run: |
          docker build --target development -t focuspocus-dev frontend
          test "$(docker run --rm focuspocus-dev node -p 'process.platform + "/" + process.arch')" = "linux/$NODE_ARCH"
      - name: Type check, run unit tests and build browser assets
        run: docker run --rm focuspocus-dev sh -ec 'npm run typecheck && npm test && npm run build'
      - name: Check source formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! docker run --rm focuspocus-dev npm run format:check; then
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD/frontend/src:/opt/workspace/src" -v "$PWD/frontend/tests:/opt/workspace/tests" \
              -v "$PWD/frontend/e2e:/opt/workspace/e2e" -v "$PWD/frontend/playwright.config.ts:/opt/workspace/playwright.config.ts" \
              -v "$PWD/frontend/integration:/opt/workspace/integration" -v "$PWD/frontend/playwright.integration.config.ts:/opt/workspace/playwright.integration.config.ts" \
              -v "$PWD/frontend/vite.config.ts:/opt/workspace/vite.config.ts" \
              focuspocus-dev ./node_modules/.bin/prettier --write src tests e2e integration playwright.config.ts playwright.integration.config.ts vite.config.ts >/dev/null
            git diff -- frontend/src frontend/tests frontend/e2e frontend/integration frontend/playwright.config.ts frontend/playwright.integration.config.ts frontend/vite.config.ts
            exit 1
          fi
      - name: Audit locked packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm focuspocus-dev npm audit --audit-level=high
      - name: Run the keyboard and pointer journeys in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker build --target browser-tests -t focuspocus-browser frontend
          docker run --rm --shm-size=512m -e CI=true -e PLAYWRIGHT_OUTPUT_DIR=/tmp/test-results focuspocus-browser
