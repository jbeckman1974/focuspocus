name: Qualify and publish version
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["release/version"]
permissions:
  contents: read
concurrency:
  group: version-publication
  cancel-in-progress: false
jobs:
  qualify:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: amd64, arch: X64 }
          - { runner: ubuntu-24.04-arm, platform: arm64, arch: ARM64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, source and native builder
        run: |
          version=$(cat release/version)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "$version"; fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = "$ARCH"
          case "$PLATFORM:$(uname -m):$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            amd64:x86_64:linux/x86_64|amd64:x86_64:linux/amd64|arm64:aarch64:linux/aarch64|arm64:aarch64:linux/arm64) ;;
            *) exit 1 ;;
          esac
      - name: Build and test the frontend
        run: |
          docker build --target development -t frontend-qualify frontend
          docker run --rm frontend-qualify npm run check
          docker run --rm frontend-qualify npm audit --audit-level=high
          docker build --target browser-tests -t browser-qualify frontend
          docker run --rm --shm-size=512m -e CI=true browser-qualify
      - name: Qualify the production image, database and worker
        run: |
          export EXPECTED_ARCH="$PLATFORM"
          export FOCUSPOCUS_IMAGE="focuspocus-candidate:$PLATFORM"
          docker build --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$FOCUSPOCUS_IMAGE" .
          bash ops/verify-stack.sh
      - name: Stage the tested image and record its registry identity
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 tools/release/visibility.py
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="focuspocus-candidate:$PLATFORM"
          test "$(docker inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$PLATFORM"
          candidate="$repo:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PLATFORM"
          docker tag "$image" "$candidate"
          docker push --platform "linux/$PLATFORM" "$candidate"
          mkdir -p "$RUNNER_TEMP/qualified"
          python3 tools/release/record.py "$candidate" "$image" > "$RUNNER_TEMP/qualified/qualified.json"
          python3 tools/release/visibility.py "$(jq -er .digest "$RUNNER_TEMP/qualified/qualified.json")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/qualified/qualified.json
          retention-days: 1
          if-no-files-found: error
  publish:
    outputs:
      release: ${{ steps.stage.outputs.release }}
    runs-on: ubuntu-24.04
    needs: qualify
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/qualified
      - name: Publish the tested version and build indexes
        id: stage
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          release=$(python3 tools/release/publish.py stage "ghcr.io/${GITHUB_REPOSITORY,,}" "$(cat release/version)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/qualified")
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$release" >> "$GITHUB_STEP_SUMMARY"
  readback:
    needs: publish
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: amd64, arch: X64 }
          - { runner: ubuntu-24.04-arm, platform: arm64, arch: ARM64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/qualified
      - name: Pull both tags using the native default and verify the selected image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.publish.outputs.release }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = "$ARCH"
          case "$PLATFORM:$(uname -m):$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            amd64:x86_64:linux/x86_64|amd64:x86_64:linux/amd64|arm64:aarch64:linux/aarch64|arm64:aarch64:linux/arm64) ;;
            *) exit 1 ;;
          esac
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          set -o pipefail
          python3 tools/release/readback.py "ghcr.io/${GITHUB_REPOSITORY,,}" "$RELEASE" "$PLATFORM" "$RUNNER_TEMP/qualified/qualified.json" | tee -a "$GITHUB_STEP_SUMMARY"
  promote:
    needs: [publish, readback]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Advance stable after both native readbacks
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          python3 tools/release/publish.py promote "ghcr.io/${GITHUB_REPOSITORY,,}" "$RELEASE"
