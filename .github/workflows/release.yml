name: Qualify and publish version
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["release/version", "release/package"]
permissions:
  contents: read
concurrency:
  group: version-publication
  cancel-in-progress: false
jobs:
  package-access:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify access to the owner-provisioned private marker
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/release/check-dispatch.sh
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "$(cat release/version)"; fi
          bash tools/release/check-session.sh
  qualify:
    needs: package-access
    uses: ./.github/workflows/qualify-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: amd64
  qualify-arm64:
    needs: qualify
    uses: ./.github/workflows/qualify-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: arm64
  publish:
    outputs:
      release: ${{ steps.stage.outputs.release }}
    runs-on: ubuntu-24.04
    needs: [qualify, qualify-arm64]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/qualified
      - name: Publish the tested version and build indexes
        id: stage
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/release/check-dispatch.sh
          bash tools/release/check-session.sh
          unset REGISTRY_TOKEN
          release=$(python3 tools/release/publish.py stage "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(cat release/package)" "$(cat release/version)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/qualified" "$GITHUB_RUN_NUMBER")
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$release" >> "$GITHUB_STEP_SUMMARY"
  readback:
    needs: publish
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: amd64, arch: X64 }
          - { runner: ubuntu-24.04-arm, platform: arm64, arch: ARM64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/qualified
      - name: Pull both tags using the native default and verify the selected image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.publish.outputs.release }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = "$ARCH"
          case "$PLATFORM:$(uname -m):$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            amd64:x86_64:linux/x86_64|amd64:x86_64:linux/amd64|arm64:aarch64:linux/aarch64|arm64:aarch64:linux/arm64) ;;
            *) exit 1 ;;
          esac
          bash tools/release/check-session.sh
          unset REGISTRY_TOKEN
          set -o pipefail
          python3 tools/release/readback.py "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(cat release/package)" "$RELEASE" "$PLATFORM" "$RUNNER_TEMP/qualified/qualified.json" | tee -a "$GITHUB_STEP_SUMMARY"
  promote:
    needs: [publish, readback]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Advance stable after both native readbacks
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          bash tools/release/check-dispatch.sh
          bash tools/release/check-session.sh
          unset REGISTRY_TOKEN
          python3 tools/release/publish.py promote "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(cat release/package)" "$RELEASE"
