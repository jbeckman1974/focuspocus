# Test data stays in a dedicated PostgreSQL cluster.
services:
  test-db:
    profiles: [testing]
    image: docker.io/library/postgres:18-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
    networks: [database]
    environment:
      POSTGRES_DB: focuspocus
      POSTGRES_PASSWORD_FILE: /run/secrets/database-admin
      FOCUSPOCUS_TEST_CLUSTER: "1"
    secrets: [database-admin, database-migrate, database-app]
    volumes:
      - testdata:/var/lib/postgresql
      - ./ops/db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d focuspocus -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  test:
    profiles: [testing]
    image: ${FOCUSPOCUS_IMAGE:-localhost/focuspocus:development}
    networks: [database]
    command: ["python", "manage.py", "test", "core", "--noinput"]
    environment:
      APP_ENV: test
      DB_NAME: focuspocus
      DB_HOST: test-db
      DB_USER: fpmigrate
      DB_PASSWORD_FILE: /run/secrets/database-migrate
      DJANGO_SECRET_KEY_FILE: /run/secrets/django-key
    secrets: [database-migrate, django-key]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  testdata:
